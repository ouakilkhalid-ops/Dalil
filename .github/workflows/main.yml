name: Build Dalil APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore (generate if missing)
        run: |
          if [ ! -f santojan.jks ]; then
            echo "santojan.jks not found - generating a new one"
            keytool -genkeypair -v -keystore santojan.jks -alias santojan \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass santojan123 -keypass santojan123 \
              -dname "CN=Khalid Ouakil, O=Dalil, C=MA"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Dalil-APK
          path: app/build/outputs/apk/release/*.apk
